<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Project</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-96">
        <h2 class="text-xl font-bold mb-4 text-blue-600">New Project</h2>
        {% if error %}
            <p class="text-red-600 text-sm mb-3">{{ error }}</p>
        {% endif %}
        <form method="POST">
            {% csrf_token %}
            <div class="mb-4">
                <label class="block text-sm font-bold mb-1">Title</label>
                <input type="text" name="title" class="w-full border p-2 rounded" required>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-bold mb-1">Description</label>
                <textarea name="description" class="w-full border p-2 rounded" rows="3"></textarea>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Create</button>
        </form>
        <a href="{% url 'dashboard' %}" class="block text-center text-sm text-gray-500 mt-4">Back to Dashboard</a>
    </div>
</body>
</html>
