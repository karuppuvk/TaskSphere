<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Task</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-96">
        <h2 class="text-xl font-bold mb-4 text-blue-600">Edit Task</h2>
        {% if error %}
            <p class="text-red-600 text-sm mb-3">{{ error }}</p>
        {% endif %}
        <form method="POST">
            {% csrf_token %}
            <div class="mb-4">
                <label class="block text-sm font-bold mb-1">Task Title</label>
                <input type="text" name="title" value="{{ task.title }}" class="w-full border p-2 rounded" required>
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-bold mb-1">Description</label>
                <textarea name="description" class="w-full border p-2 rounded" rows="3">{{ task.description }}</textarea>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-bold mb-1">Assign to Team Member</label>
                <select name="assigned_to" class="w-full border p-2 rounded bg-white">
                    <option value="">-- Unassigned --</option>
                    {% for member in team_members %}
                        <option value="{{ member.id }}" {% if task.assigned_to and task.assigned_to.id == member.id %}selected{% endif %}>
                            {{ member.username }} ({{ member.get_role_display }})
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-bold mb-1">Status</label>
                <select name="status" class="w-full border p-2 rounded bg-white">
                    <option value="TODO" {% if task.status == 'TODO' %}selected{% endif %}>To Do</option>
                    <option value="IN_PROGRESS" {% if task.status == 'IN_PROGRESS' %}selected{% endif %}>In Progress</option>
                    <option value="DONE" {% if task.status == 'DONE' %}selected{% endif %}>Done</option>
                </select>
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Update Task</button>
        </form>
        <a href="{% url 'dashboard' %}" class="block text-center text-sm text-gray-500 mt-4">Back to Dashboard</a>
    </div>
</body>
</html>
